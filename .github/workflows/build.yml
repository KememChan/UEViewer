name: Build UModel (Win64)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile UModel (Win64)
        shell: bash
        run: ./Tools/ci_build.sh

      - name: Upload umodel_64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: umodel_64-wuwa-fixed
          path: |
            umodel_64.exe
            umodel.exe
          if-no-files-found: error
