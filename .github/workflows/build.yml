name: Build UModel (Win64)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone BuildTools
        run: |
          git clone https://github.com/gildor2/BuildTools.git C:\BuildTools

      - name: Build UEViewer (Win64)
        shell: bash
        run: |
          export PATH="/c/BuildTools/bin:$PATH"
          ./build.sh --64

      - name: Upload umodel_64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: umodel_64-wuwa-fixed
          path: umodel_64.exe
          if-no-files-found: error
