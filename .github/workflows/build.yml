name: Build UModel (Win64)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSVC Compiler Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup BuildTools
        shell: bash
        run: |
          git clone https://github.com/gildor2/BuildTools.git C:/BuildTools

          # Provide an MSVC-aware vc32tools wrapper that directly uses the initialized MSVC environment
          cat << 'EOF' > C:/BuildTools/bin/vc32tools
#!/bin/bash
found_vc=17
found_vc_year=2022
workpath="${VCINSTALLDIR:-C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC}"
workpath="${workpath//\\//}"

Make() {
    local mkfile="$1"
    shift
    if [ -f "C:/BuildTools/bin/jom.exe" ]; then
        C:/BuildTools/bin/jom.exe -nologo -f "$mkfile" "$@"
    else
        nmake -nologo -f "$mkfile" "$@"
    fi
}

while [ "$1" ]; do
    case "$1" in
        --check)
            break
            ;;
        --make)
            shift
            Make "$@"
            exit $?
            ;;
        *)
            shift
            ;;
    esac
done
EOF
          chmod +x C:/BuildTools/bin/vc32tools

      - name: Build UEViewer (Win64)
        shell: bash
        run: |
          export PATH="/c/BuildTools/bin:$PATH"
          ./build.sh --64

      - name: Upload umodel_64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: umodel_64-wuwa-fixed
          path: |
            umodel_64.exe
            umodel.exe
          if-no-files-found: error
